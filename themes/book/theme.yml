name: book
extends: base
description: A classic long-form book template. Serif body (Source Serif), sans
  headings, quiet large chapter numerals. Numbering, cross-references, and the
  TOC live in CSS (counters + target-counter/target-text), not the engine.

page:
  size: A4
  margin: 20mm

vars:
  title: Untitled
  subtitle: ""
  author: ""
  accent: "#9a3412"        # warm sienna for chapter numerals + rules
  accent-dark: "#7c2d12"
  body-font: "Source Serif 4"
  heading-font: "Inter"
  cover-image: ""          # path to the cover art, resolved against the project

masters:
  body:
    classes: ""
    furniture: stamp
    header: { verso: "{title}", recto: "{chapter}" }
  title:     { classes: "titlepage", furniture: none }
  copyright: { classes: "copyrightpage", furniture: none }
  cover:     { classes: "coverpage", furniture: none }

components:
  title: { master: title }
  copyright: { master: copyright }
  cover: { master: cover }

# A book's notes belong with their chapter, not 300 pages away.
footnotes: chapter
