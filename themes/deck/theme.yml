name: deck
extends: report
mode: deck
description: "Beautiful 16:9 presentation slides with report-grade visuals \u2014\
  \ a title slide, section dividers, a slide counter, and the report component vocabulary\
  \ (KPI tiles, finding cards, stat strips) on slides. Customizable by accent, fonts,\
  \ and aspect ratio.\n"
page:
  size: '16:9'
  margin: 14mm
vars:
  accent: '#4f46e5'
  accent-dark: '#3730a3'
  body-font: Inter
  heading-font: Inter
  toc_depth: 1
masters:
  title: {}
  statement: {}
  closing: {}
components:
  statement:
    master: statement
  closing:
    master: closing
