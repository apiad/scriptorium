name: base
description: >
  Foundation theme — the customization var contract, vendored fonts, and correct
  base styling for prose, code, math, tables, and layout primitives. Not used
  directly; every other theme extends it and adds a point of view.

page:
  size: A4
  margin: 20mm

# The customization contract. Override any of these per-theme or per-project
# (project vars win). Colors and fonts are injected as CSS custom properties.
vars:
  accent: "#2563eb"
  accent-dark: "#1e40af"
  ink: "#1a1a1a"
  muted: "#6b7280"
  rule: "#e5e7eb"
  body-font: "Inter"
  heading-font: "Inter"
  mono-font: "JetBrains Mono"
  # Heading for the generated references section. Empty means no heading at
  # all, which is the default because the label's language is the document's
  # business, not the engine's: set it to "References", "Bibliografía", or
  # whatever the venue wants, in theme.yml or in frontmatter.
  references-label: ""
  # Heading for the generated glossary, on the same contract: empty means no
  # heading, because "Glossary" is as wrong for a Spanish document as
  # "References" would be.
  glossary-label: ""
  # And for the generated endnotes section. `book` overrides nothing — a book
  # that wants "References and Notes" says so in its own scriptorium.yaml.
  footnotes-label: ""

# Where footnote definitions collect: document | chapter | page.
# Frontmatter `footnotes:` overrides this per document.
footnotes: document

components:
  footnotes:
    keep_together: false   # an endnotes section is often taller than a page
  references:
    keep_together: false   # and so is a reference list
  glossary:
    keep_together: false   # and a five-hundred-entry glossary most of all
  timeline:
    keep_together: false
