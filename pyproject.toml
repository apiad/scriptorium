[project]
name = "scriptorium"
version = "0.7.0"
description = "Markdown-native document engine: weave to exact-geometry PDF / HTML book / EPUB, tangle, execute."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alejandro Piad" }]
dependencies = [
    "markdown-it-py>=3.0",
    "weasyprint>=63",
    "pyyaml>=6",
    "pygments>=2.20.0",
    "quickjax>=0.1.0",
    "mdit-py-plugins>=0.6.1",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scriptorium"]

[dependency-groups]
dev = ["pytest>=8"]
