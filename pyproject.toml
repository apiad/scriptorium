[project]
name = "scriptorium"
version = "0.0.1"
description = "Markdown-native document engine: weave to exact-geometry PDF / HTML book / EPUB, tangle, execute."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "weasyprint>=63",
    "pyyaml>=6",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scriptorium"]

[dependency-groups]
dev = ["pytest>=8"]
